<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataScope · 结构透镜 — JSON/YAML/TOML 可视化编辑器</title>
  <meta name="description" content="DataScope · 零依赖、离线的 JSON/YAML/TOML 结构可视化与智能编辑工作台。" />
  <link rel="stylesheet" href="src/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <div class="brand-text">
          <strong>DataScope</strong>
          <span class="brand-sub">结构透镜</span>
        </div>
      </div>

      <div class="fmt-switch" role="tablist" aria-label="数据格式">
        <button class="fmt-btn active" data-fmt="json">JSON</button>
        <button class="fmt-btn" data-fmt="yaml">YAML</button>
        <button class="fmt-btn" data-fmt="toml">TOML</button>
        <button class="fmt-btn" data-fmt="csv">CSV</button>
      </div>

      <div class="toolbar">
        <button id="btn-format" class="tool-btn" title="格式化 (Ctrl+S)">⇄ 格式化</button>
        <button id="btn-minify" class="tool-btn" title="压缩为单行">⤢ 压缩</button>
        <button id="btn-sort" class="tool-btn" title="按键名排序">⇅ 排序</button>
        <button id="btn-redact" class="tool-btn" title="脱敏敏感值" aria-pressed="false">◐ 脱敏</button>
        <button id="btn-stats" class="tool-btn" title="结构统计">▤ 统计</button>
        <span class="tool-sep"></span>
        <button id="btn-import" class="tool-btn" title="导入文件">⇪ 导入</button>
        <button id="btn-export" class="tool-btn" title="导出文件">⇩ 导出</button>
        <button id="btn-sample" class="tool-btn" title="加载示例">✦ 示例</button>
        <span class="tool-sep"></span>
        <button id="btn-collapse" class="tool-btn" title="全部折叠">– 折叠</button>
        <button id="btn-expand" class="tool-btn" title="全部展开">+ 展开</button>
        <button id="btn-theme" class="tool-btn icon-btn" title="切换主题">☀︎</button>
      </div>
    </header>

    <!-- Main workspace -->
    <main class="workspace">
      <!-- Editor pane -->
      <section class="pane editor-pane">
        <div class="pane-head">
          <span class="pane-title">源数据</span>
          <input id="search" class="search" type="search" placeholder="🔍 在树中搜索…" />
        </div>
        <div class="editor-shell">
          <pre id="line-gutter" class="line-gutter">1</pre>
          <textarea id="editor" class="editor" spellcheck="false" aria-label="数据编辑器"></textarea>
        </div>
      </section>

      <!-- Tree pane -->
      <section class="pane tree-pane">
        <div class="pane-head">
          <span class="pane-title">结构树</span>
          <span class="pane-hint">双击标量可直接编辑 · 悬停节点显示操作</span>
        </div>
        <div id="tree-view" class="tree-view"></div>
      </section>
    </main>

    <!-- Status bar -->
    <footer id="status" class="status">就绪</footer>
  </div>

  <div id="drop-zone" class="drop-zone">松开以导入文件</div>
  <input type="file" id="file-input" accept=".json,.yaml,.yml,.toml,.csv,.txt" hidden />

  <script type="module" src="src/js/parser.js"></script>
  <script type="module" src="src/js/utils.js"></script>
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
